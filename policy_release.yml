name: Generate Checksum and Bump Version

on:
  push:
    paths:
      - 'policies/intelligence_policy.json'
    branches:
      - main

jobs:
  update-policy-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SHA-256 and Increment Version
        run: |
          # Compute sha256 checksum
          sha256sum policies/intelligence_policy.json | awk '{print $1}' > policies/intelligence_policy.sha256
          
          # Increment policy version
          CURRENT_VER=$(cat policies/policy_version.txt 2>/dev/null || echo 0)
          NEW_VER=$((CURRENT_VER + 1))
          echo "$NEW_VER" > policies/policy_version.txt

      - name: Commit and Push Metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-bump policy version and checksum [skip ci]"
          file_pattern: "policies/policy_version.txt policies/intelligence_policy.sha256"
