name: Global Intel Harvester
on:
  schedule:
    - cron: '0 */4 * * *' # Runs automatically every 4 hours
  workflow_dispatch:      # Allows manual clicking from GitHub
jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Harvester
        run: python harvester.py
        
      - name: Commit and Push Intel
        run: |
          git config --global user.name "Nexa SOC Bot"
          git config --global user.email "soc@nexasecurity.com"
          git add feeds/
          # If there are no new IPs, it won't crash
          git commit -m "update: synced latest Android IOCs" || exit 0
          git push
