name: Global Multi-Vector Intel Harvester
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python harvester.py
      - run: |
          git config --global user.name "Nexa SOC Bot"
          git config --global user.email "soc@nexasecurity.com"
          git add feeds/
          git commit -m "update: synced global multi-vector IOC feeds" || exit 0
          git push
